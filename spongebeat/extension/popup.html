<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SpongeBeat</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <img src="images/icon128.png" alt="" width="56" height="56">
  <div>
    <h1>SpongeBeat</h1>
    <p id="status" role="status">Checking this tab…</p>
  </div>
</header>

<label class="row">
  <span>Dance when music plays</span>
  <input id="enabled" type="checkbox" role="switch">
</label>

<fieldset class="row">
  <legend>Size</legend>
  <div class="sizes">
    <label><input type="radio" name="size" value="small"><span>Small</span></label>
    <label><input type="radio" name="size" value="medium"><span>Medium</span></label>
    <label><input type="radio" name="size" value="large"><span>Large</span></label>
  </div>
</fieldset>

<button id="capture" type="button">Sync to this tab's audio</button>
<p class="hint" id="hint">Works on any site, including ones that hide their audio. Drag him to move him.</p>

<script src="popup.js"></script>
</body>
</html>
