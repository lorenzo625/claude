<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angel Bear · PS2-style model</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  body { background: radial-gradient(ellipse at 50% 60%, #1c1830 0%, #07060d 60%, #000 100%); }
  #view { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  #view:active { cursor: grabbing; }
  #hud {
    position: fixed; left: 16px; bottom: 16px; right: 16px;
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px;
    font: 13px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #c9c6dd; pointer-events: none;
  }
  #hud h1 { margin: 0 0 2px; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: #fff; }
  #hud p { margin: 0; }
  #controls { display: flex; gap: 8px; pointer-events: auto; }
  button {
    font: inherit; color: #c9c6dd; background: rgba(20, 18, 36, .8); border: 1px solid #4b4670;
    padding: 6px 10px; border-radius: 3px; cursor: pointer;
  }
  button[aria-pressed="true"] { color: #fff; background: #3a3fa8; border-color: #7b82ff; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">
  <div>
    <h1>Angel Bear</h1>
    <p id="stats">Loading…</p>
    <p>Drag to orbit · scroll to zoom</p>
  </div>
  <div id="controls">
    <button id="ps2" type="button">PS2 resolution</button>
    <button id="wire" type="button">Wireframe</button>
    <button id="spin" type="button">Animate</button>
  </div>
</div>
